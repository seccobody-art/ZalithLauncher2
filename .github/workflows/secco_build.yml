name: Secco build

# Run it by hand: Actions tab -> "Secco build" -> Run workflow.
# The APK shows up under "Artifacts" at the bottom of the finished run.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU architecture. arm64 fits almost every modern phone."
        type: choice
        options:
          - arm64
          - arm
          - x86_64
          - all
        default: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Optional. Without them CurseForge search and Microsoft login are switched off,
      # everything else (Modrinth, offline accounts, the game itself) still works.
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.arch == 'arm64' && 'aarch64-linux-android' || inputs.arch == 'arm' && 'armv7-linux-androideabi' || inputs.arch == 'x86_64' && 'x86_64-linux-android' || 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-${{ inputs.arch }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build debug APK (${{ inputs.arch }})
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=${{ inputs.arch }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: secco-debug-${{ inputs.arch }}
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
